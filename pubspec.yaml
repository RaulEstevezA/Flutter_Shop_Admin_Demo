name: flutter_shop_admin
description: "Web demo of Flutter Shop Admin with a simulated in-browser backend."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.3.2
  flutter_staggered_grid_view: ^0.7.0
  formz: 0.8.0
  go_router: ^6.2.0
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/products/
    - assets/loaders/
    - assets/images/
    - google_fonts/montserrat_alternates/
